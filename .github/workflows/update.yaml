name: Nightly Edge Canary Update

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-edge-canary:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: canary
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Update package URL, checksum, and size
        run: ./.github/scripts/update-edge-canary.sh

      - name: Commit and push changes
        run: |
          if git diff --quiet -- com.microsoft.EdgeCanary.yaml; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add com.microsoft.EdgeCanary.yaml
          git commit -m "Update Edge Canary package metadata"
          git push origin HEAD:${TARGET_BRANCH}
